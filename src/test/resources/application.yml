spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

search:
  opensearch:
    host: localhost
    port: 9200
    scheme: http
  embedding:
    mock-enabled: true
    dimensions: 384
  defaults:
    limit: 20
    max-limit: 100
    default-search-type: HYBRID
    default-index-name: entities
