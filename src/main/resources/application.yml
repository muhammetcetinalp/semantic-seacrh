spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: semantic-search
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE_NAME:FREEPDB1}}
    username: ${DB_USERNAME:semantic_search}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    consumer:
      group-id: ${KAFKA_GROUP_ID:semantic-search-indexer}
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 10
      properties:
        "allow.auto.create.topics": true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "max.block.ms": 10000
        "delivery.timeout.ms": 10000
        "request.timeout.ms": 5000

search:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  kafka:
    enabled: ${SEARCH_KAFKA_ENABLED:true}
    topics: ${SEARCH_KAFKA_TOPICS:olaylar-events}
    dead-letter-topic: ${SEARCH_KAFKA_DEAD_LETTER_TOPIC:olaylar.indexing.errors}
    retry-attempts: ${SEARCH_KAFKA_RETRY_ATTEMPTS:2}
    retry-delay-ms: ${SEARCH_KAFKA_RETRY_DELAY_MS:1000}
    publish-timeout-ms: 10000
    concurrency: ${SEARCH_KAFKA_CONCURRENCY:1}
    # Incident routing for events
    routes:
      "[OLAY]":
        operation: UPSERT
        index-name: olaylar
        document-type: OLAY
      "[OLAY_BILDIRILDI]":
        operation: UPSERT
        index-name: olaylar
        document-type: OLAY
      "[OLAY_GUNCELLENDI]":
        operation: UPSERT
        index-name: olaylar
        document-type: OLAY
      "[OLAY_SILINDI]":
        operation: DELETE
        index-name: olaylar
        document-type: OLAY
  opensearch:
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
    scheme: ${OPENSEARCH_SCHEME:http}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    connect-timeout: ${OPENSEARCH_CONNECT_TIMEOUT:5000}
    socket-timeout: ${OPENSEARCH_SOCKET_TIMEOUT:60000}
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock}        # mock | tei | rest
    endpoint: ${EMBEDDING_ENDPOINT:http://localhost:8081}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:384}
    timeout: ${EMBEDDING_TIMEOUT:30000}
    mock-enabled: ${EMBEDDING_MOCK_ENABLED:true}
  reranking:
    enabled: ${SEARCH_RERANKING_ENABLED:true}
    provider: ${SEARCH_RERANKING_PROVIDER:java}   # java (pure in-memory) | ollama
    endpoint: ${SEARCH_RERANKING_ENDPOINT:http://localhost:11434}
    model: ${SEARCH_RERANKING_MODEL:BAAI/bge-reranker-v2-m3}
  colbert:
    enabled: ${SEARCH_COLBERT_ENABLED:true}
    provider: ${SEARCH_COLBERT_PROVIDER:java}     # java (pure in-memory)
    model: ${SEARCH_COLBERT_MODEL:jinaai/jina-colbert-v2}
    storage: ${SEARCH_COLBERT_STORAGE:qdrant}     # qdrant | direct
  qdrant:
    enabled: ${SEARCH_QDRANT_ENABLED:true}
    endpoint: ${SEARCH_QDRANT_ENDPOINT:http://localhost:6333}
    collection-name: ${SEARCH_QDRANT_COLLECTION:colbert_olaylar}
    vector-size: 128
  defaults:
    limit: ${SEARCH_DEFAULT_LIMIT:20}
    max-limit: ${SEARCH_MAX_LIMIT:100}
    default-search-type: HYBRID
    default-index-name: ${SEARCH_DEFAULT_INDEX:olaylar}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.example.semantic_search: DEBUG
    org.opensearch: WARN
    org.opensearch.client: DEBUG
