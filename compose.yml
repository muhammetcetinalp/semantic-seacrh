# Local development dependencies. OpenSearch security is disabled only here.
name: semantic-search

services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-semantic_search}
      POSTGRES_USER: ${DB_USERNAME:-semantic_search}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SearchDev2026}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-semantic_search} -d ${DB_NAME:-semantic_search}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  reranker:
    image: michaelf34/infinity:latest
    command: v2 --model-id ${SEARCH_RERANKING_MODEL:-BAAI/bge-reranker-v2-m3} --port 7997 --batch-size 8 --no-model-warmup
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8082}:7997"
    environment:
      - HF_HOME=/data
      - INFINITY_MODEL_ID=${SEARCH_RERANKING_MODEL:-BAAI/bge-reranker-v2-m3}
      - INFINITY_PORT=7997
      - INFINITY_BATCH_SIZE=8
      - INFINITY_MODEL_WARMUP=false
    volumes:
      - reranker-data:/data
    restart: unless-stopped

volumes:
  opensearch-data:
  pg17-data:
  kafka-data:
  reranker-data:

